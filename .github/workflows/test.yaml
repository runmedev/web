name: Test
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1
  SHELL: /bin/bash

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install Runme CLI
        shell: bash
        run: |
          set -euo pipefail
          # Avoid the action's release-list lookup, which can return no releases.
          # Pin the same published CLI and verify its release checksum instead.
          runme_dir="$RUNNER_TEMP/runme-cli"
          mkdir -p "$runme_dir"
          cd "$runme_dir"
          curl --fail --location --retry 3 --output runme_linux_x86_64.tar.gz \
            https://github.com/runmedev/runme/releases/download/v3.17.6/runme_linux_x86_64.tar.gz
          echo '7f0add22316a749f59ec28fd13a7594e4e202f212fe640213f6ef7068403307d  runme_linux_x86_64.tar.gz' | sha256sum --check
          tar -xzf runme_linux_x86_64.tar.gz runme
          echo "$runme_dir" >> "$GITHUB_PATH"
          ./runme --version
      - name: Install dependencies
        run: runme run configure setup
      - name: 📦 Bundle
        run: runme run build
      - name: 🧪 Test
        run: runme run test
      - name: Test agent widgets and key vault
        run: >-
          pnpm -C app exec vitest run
          src/lib/agents src/lib/keyvault src/components/Agents src/components/KeyVault
          src/lib/runtime/sandboxJsKernel.test.ts src/lib/notebookData.test.ts
          src/components/Actions/Actions.test.tsx
          --maxWorkers=2 --minWorkers=1
      - name: Test storage restart and editor recovery
        run: >-
          pnpm -C app exec vitest run
          src/storage/storageRecovery.test.ts src/lib/storageRecoveryDrafts.test.ts
          src/components/StorageRecoveryBanner.test.tsx
          --maxWorkers=2 --minWorkers=1
      - name: Test explorer folder refresh
        run: >-
          pnpm -C app exec vitest run
          src/lib/explorerSync.test.ts
          src/components/Workspace/WorkspaceExplorer.test.tsx
          --maxWorkers=2 --minWorkers=1
      - name: Test desktop renderer and workload identity integration
        run: >-
          pnpm -C app exec vitest run
          src/auth/workloadIdentity.desktop.test.ts
          src/auth/runnerAuth.test.ts
          src/contexts/GoogleAuthContext.workload.test.tsx
          src/lib/appConfig.test.ts
          src/lib/runtime/runnerAuthTools.test.ts
          src/lib/runtime/desktopTools.test.ts
          src/lib/runtime/codeOperationRegistry.test.ts
          src/components/WebMcp/WebMcpToolRegistrationHost.test.tsx
          --maxWorkers=2 --minWorkers=1

  controlled-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: releaser/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:renderers && pnpm run build:console
      - run: pnpm -C app exec playwright-core install --with-deps chromium
      - run: pnpm -C app run cuj:releases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-release-evidence
          path: app/test/browser/test-output/controlled-releases/
