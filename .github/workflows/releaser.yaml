name: Releaser

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      web_branch:
        description: "web repo branch"
        required: false
        default: "main"
      dry_run:
        description: "Run without publishing"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 * * * *"
  pull_request:
    paths:
      - "releaser/**"
      - ".github/workflows/releaser.yaml"

permissions:
  id-token: write
  contents: read
  checks: read

concurrency:
  group: releaser-production
  cancel-in-progress: false

jobs:
  releaser:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: runme-lewi-dev
      GCP_PROJECT_NUMBER: "690012737568"
      GCP_WIF_POOL_ID: github-pool
      GCP_WIF_PROVIDER_ID: github-provider
      GCP_SERVICE_ACCOUNT_EMAIL: runme-gha@runme-lewi-dev.iam.gserviceaccount.com
      RELEASER_BUCKET: gs://runme-hosted
      RELEASER_WEB_REPO: runmedev/web
      VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.GCP_WIF_POOL_ID }}/providers/${{ env.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: releaser/go.mod
          cache-dependency-path: releaser/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Test releaser
        working-directory: releaser
        run: go test -race ./...

      - name: Build releaser
        shell: bash
        run: |
          set -euo pipefail
          cd releaser
          go build -trimpath -o ../releaser-bin .

      - name: Wait for release acceptance checks
        if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node releaser/wait-for-acceptance.mjs

      - name: Install candidate acceptance browser
        if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm -C app exec playwright install --with-deps chromium

      - name: Run releaser
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_WEB_BRANCH: ${{ github.event.inputs.web_branch }}
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
          STABLE_FOLLOW_LATEST: ${{ vars.STABLE_FOLLOW_LATEST || 'true' }}
        run: |
          set -euo pipefail

          WEB_BRANCH="main"
          BUCKET="${RELEASER_BUCKET}"
          DRY_RUN="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${REQUESTED_WEB_BRANCH}" ]; then
              WEB_BRANCH="${REQUESTED_WEB_BRANCH}"
            fi
            if [ "${REQUESTED_DRY_RUN}" = "true" ]; then
              DRY_RUN="true"
            fi
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DRY_RUN="true"
            BUCKET="${RUNNER_TEMP}/releaser-pr-bucket"
          fi

          ./releaser-bin reconcile \
            --publish-channels \
            --validated-commit="${GITHUB_SHA}" \
            --stable-follow-latest="${STABLE_FOLLOW_LATEST}" \
            --web="${WEB_BRANCH}" \
            --web-repo="${RELEASER_WEB_REPO}" \
            --bucket="${BUCKET}" \
            --dry-run="${DRY_RUN}"
